ow much you have, not how willing you are to give."],["humble","Humble is about modesty, not about giving."]],"B",'A generous person gives freely. The opposite is "mean" (or stingy), meaning unwilling to give or share.'),G("eng-tense-1","English Language","Tenses",'Choose the correct form: "By the time we arrived, the bus ___."',[["leaves","This is present tense, but the sentence describes the past."],["has left","The present perfect connects to now, but here both actions are in the past."],["had left"],["is leaving","This is present continuous, which does not fit a past event."]],"C",'When one past action happened before another past action, use the past perfect (had + past participle). The bus left first, then we arrived: "the bus had left".'),G("eng-punc-1","English Language","Punctuation","Which sentence is correctly punctuated?",[["Its raining outside.",'"Its" without an apostrophe shows possession (the dog wagged its tail). Here we mean "it is".'],["It's raining outside."],["Its' raining outside.",`"Its'" is never correct in English.`],["It,s raining outside.","A comma cannot replace an apostrophe."]],"B",`"It's" is short for "it is" or "it has". The apostrophe shows where letters have been left out.`),G("sci-cell-1","Integrated Science","Cells and life processes","Which part of a cell controls all its activities?",[["Cell membrane","The membrane controls what enters and leaves the cell, not all its activities."],["Cytoplasm","Cytoplasm is the jelly-like fluid where many reactions happen, but it does not control them."],["Nucleus"],["Cell wall","The cell wall (found in plant cells) gives support and shape."]],"C","The nucleus holds the genetic material (DNA), which directs the cell's activities. It works like the headteacher's office of the cell."),G("sci-photo-1","Integrated Science","Cells and life processes","Which gas do green plants take in for photosynthesis?",[["Oxygen","Oxygen is released during photosynthesis, not taken in."],["Carbon dioxide"],["Nitr
