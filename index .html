 a 15% discount on a GH\u20B5 240 bag. How much is the discount?",[["GH\u20B5 36"],["GH\u20B5 24","GH\u20B5 24 is 10% of 240, not 15%."],["GH\u20B5 16",'This divides 240 by 15. A percentage means "out of 100", so multiply by 15/100.'],["GH\u20B5 360","The decimal point is in the wrong place: 15 \xD7 240 = 3600, which must then be divided by 100."]],"A","15% of 240 = (15 \xF7 100) \xD7 240 = 0.15 \xD7 240 = GH\u20B5 36. The customer pays 240 \u2212 36 = GH\u20B5 204."),G("math-alg-1","Mathematics","Linear equations","Solve 2x + 5 = 17.",[["x = 6"],["x = 11","This adds 5 to 17 instead of subtracting it: (17 + 5) \xF7 2 = 11."],["x = 8.5","This divides 17 by 2 without first removing the + 5."],["x = 12","This subtracts 5 correctly but forgets to divide by 2."]],"A","Subtract 5 from both sides: 2x = 12. Divide both sides by 2: x = 6. Check: 2(6) + 5 = 17 \u2713."),G("math-alg-2","Mathematics","Linear equations","Expand 3(x \u2212 4).",[["3x \u2212 12"],["3x \u2212 4","Only x was multiplied by 3. The 3 must multiply every term inside the bracket."],["x \u2212 12","Only the 4 was multiplied by 3. The x must be multiplied too."],["3x + 12","The sign is wrong: 3 \xD7 (\u22124) = \u221212."]],"A","Multiply each term inside the bracket by 3: 3 \xD7 x = 3x and 3 \xD7 (\u22124) = \u221212, giving 3x \u2212 12."),G("math-geo-1","Mathematics","Angles and shapes","Two angles of a triangle are 50\xB0 and 65\xB0. Find the third angle.",[["65\xB0"],["75\xB0","This looks like an arithmetic slip. 180 \u2212 115 = 65, not 75."],["115\xB0","This is the sum of the two given angles, not the missing angle."],["245\xB0","This uses 360\xB0, the angle sum of a quadrilateral. A triangle's angles add up to 180\xB0."]],"A","Angles in a triangle add up to 180\xB0. 50\xB0 + 65\xB0 = 115\xB0, and 180\xB0 \u2212 115\xB0 = 65\xB0. The triangle is isosceles."),G("math-geo-2","Mathematics","Angles and shapes","A rectangular garden is 8 m long and 5 m wide. What is its area?",[["13 m\xB2","This adds leng s about how much you have, not how willing you are to give."],["humble","Humble is about modesty, not about giving."]],"B",'A generous person gives freely. The opposite is "mean" (or stingy), meaning unwilling to give or share.'),G("eng-tense-1","English Language","Tenses",'Choose the correct form: "By the time we arrived, the bus ___."',[["leaves","This is present tense, but the sentence describes the past."],["has left","The present perfect connects to now, but here both actions are in the past."],["had left"],["is leaving","This is present continuous, which does not fit a past event."]],"C",'When one past action happened before another past action, use the past perfect (had + past participle). The bus left first, then we arrived: "the bus had left".'),G("eng-punc-1","English Language","Punctuation","Which sentence is correctly punctuated?",[["Its raining outside.",'"Its" without an apostrophe shows possession (the dog wagged its tail). Here we mean "it is".'],["It's raining outside."],["Its' raining outside.",`"Its'" is never correct in English.`],["It,s raining outside.","A comma cannot replace an apostrophe."]],"B",`"It's" is short for "it is" or "it has". The apostrophe shows where letters have been left out.`),G("sci-cell-1","Integrated Science","Cells and life processes","Which part of a cell controls all its activities?",[["Cell membrane","The membrane controls what enters and leaves the cell, not all its activities."],["Cytoplasm","Cytoplasm is the jelly-like fluid where many reactions happen, but it does not control them."],["Nucleus"],["Cell wall","The cell wall (found in plant cells) gives support and shape."]],"C","The nucleus holds the genetic material (DNA), which directs the cell's activities. It works like the headteacher's office of the cell."),G("sci-photo-1","Integrated Science","Cells and life processes","Which gas do green plants take in for photosynthesis?",[["Oxygen","Oxygen is released during photosynthesis, not taken in."],["Carbon dioxide"],["Nitrogen","Nitrogen is in the air, but plants do not use it in photosynthesis. They take nitrogen in as nitrates through their roots."],["Hydrogen","Plants do not take in hydrogen gas."]],"B","Photosynthesis: carbon dioxide + water \u2192 glucose + oxygen. It needs light energy and chlorophyll. Carbon dioxide enters through the stomata in the leaves."),G("sci-heart-1","Integrated Science","Cells and life processes","Which organ pumps blood around the human body?",[["Lungs","The lungs exchange gases (take in oxygen, remove carbon dioxide). They do not pump blood."],["Kidney","The kidneys filter waste from the blood."],["Heart"],["Liver","The liver processes nutrients and removes toxins."]],"C","The heart is a muscular pump. It sends blood through the arteries to the body and lungs, and the blood returns through the veins."),G("sci-mat-1","Integrated Science","Matter","What is the change of state from solid directly to gas called?",[["Melting","Melting is solid \u2192 liquid."],["Evaporation","Evaporation is liquid \u2192 gas."],["Sublimation"],["Condensation","Condensation is gas \u2192 liquid."]],"C","Sublimation is when a solid turns straight into a gas without becoming a liquid first. Camphor (mothballs) and dry ice are common examples."),G("sci-mat-2","Integrated Science","Matter","Which of these is a chemical change?",[["Melting ice","Melting only changes the state. It is still water, so this is a physical change."],["Dissolving sugar in water","The sugar can be recovered by evaporating the water, so this is a physical change."],["Burning charcoal"],["Boiling water","This is only a change of state (a physical change)."]],"C","Burning charcoal makes new substances (carbon dioxide and ash) and gives off heat. It cannot easily be reversed, so it is a chemical change."),G("sci-elec-1","Integrated Science","Electricity","What is the SI unit of electric current?",[["Volt","The volt is the unit of potential difference (voltage)."],["Ampere"],["Ohm","The ohm is the unit of resistance."],["Watt","The watt is the unit of power."]],"B","Current is measured in amperes (A) with an ammeter, which is connected in series. A useful link: V = I \xD7 R (voltage = current \xD7 resistance)."),G("soc-hist-1","Social Studies","Ghana's history","On which date did Ghana gain independence?",[["6 March 1957"],["1 July 1960","1 July 1960 is when Ghana became a republic."],["6 March 1960","The day is right but the year is wrong."],["24 February 1966","This is the date of the coup that overthrew the First Republic."]],"A","Ghana became independent from British rule on 6 March 1957, the first country in sub-Saharan Africa to do so from colonial rule. 6 March is celebrated as Independence Day."),G("soc-hist-2","Social Studies","Ghana's history","Who was the first President of Ghana?",[["Dr J.B. Danquah","Danquah was a leading figure in the UGCC, but he was never President."],["Dr Kwame Nkrumah"],["J.A. Kufuor","Kufuor was President from 2001 to 2009."],["Dr Hilla Limann","Limann was President of the Third Republic (1979\u20131981)."]],"B","Kwame Nkrumah led Ghana to independence as Prime Minister in 1957. He became the first President when Ghana became a republic in 1960."),G("soc-gov-1","Social Studies","Government","Which arm of government makes laws?",[["The Executive","The Executive (the President and ministers) carries out laws."],["The Judiciary","The Judiciary (the courts) interprets laws."],["The Legislature"],["The Electoral Commission","The Electoral Commission organises elections. It is not an arm of government."]],"C","The Legislature makes laws. In Ghana, the Legislature is Parliament. The three arms are the Legislature (makes laws), the Executive (carries them out) and the Judiciary (interprets them)."),G("soc-gov-2","Social Studies","Government","Which arm of government interprets the law?",[["The Legislature","The Legislature makes laws."],["The Executive","The Executive carries out laws."],["The Judiciary"],["The Police Service","The police enforce the law, but they do not interpret it."]],"C","The Judiciary (the courts, headed by the Chief Justice) interprets laws and settles disputes. Keeping the three arms separate is called separation of powers."),G("soc-env-1","Social Studies","Environment","Which human activity contributes most directly to soil erosion?",[["Planting cover crops","Cover crops protect the soil from rain and wind, so they reduce erosion."],["Deforestation"],["Contour ploughing","Ploughing across a slope slows running water, so it reduces erosion."],["Mulching","Mulch covers and protects the soil, so it reduces erosion."]],"B","Tree roots hold soil together, and the leaves break the force of rain. When forests are cleared, for example for farming, timber or illegal mining (galamsey), rain and wind wash the topsoil away."),G("soc-cit-1","Social Studies","Citizenship","Which of these is a civic responsibility of a Ghanaian citizen?",[["Paying taxes"],["Travelling abroad","Travelling is a personal choice, not a duty to the nation."],["Owning a car","Owning property is a personal choice, not a civic duty."],["Joining a social club","Joining a club is voluntary, not a civic duty."]],"A","Civic responsibilities are duties citizens owe the nation. They include paying taxes, obeying the law, voting and protecting public property. Taxes pay for roads, schools and hospitals."),G("math-ratio-1","Mathematics","Ratio and proportion","Share GH\u20B5 60 between Kofi and Ama in the ratio 2 : 3. How much does Ama get?",[["GH\u20B5 24","GH\u20B5 24 is Kofi's share (2 parts), not Ama's."],["GH\u20B5 36"],["GH\u20B5 30","This splits the money equally. The ratio 2 : 3 gives Ama more."],["GH\u20B5 20","This divides 60 by 3 and ignores the total number of parts (2 + 3 = 5)."]],"B","Total parts = 2 + 3 = 5. One part = 60 \xF7 5 = GH\u20B5 12. Ama gets 3 parts = 3 \xD7 12 = GH\u20B5 36. Check: Kofi 24 + Ama 36 = 60 \u2713."),G("math-ind-1","Mathematics","Indices","Simplify 2\xB3 \xD7 2\u2074.",[["2\ ticulous."',[["careful"],["careless","This is the opposite of meticulous."],["friendly","Friendliness is about how someone treats people, not how carefully they work."],["strict","A strict person enforces rules. Meticulous means paying close attention to detail."]],"A","Meticulous means very careful and precise, paying great attention to every detail."),G("eng-idiom-1","English Language","Idioms",'What does "to let the cat out of the bag" mean?',[["To reveal a secret"],["To free an animal","This is the literal meaning. Idioms have a figurative meaning."],["To make a mistake","Revealing a secret can be a mistake, but the idiom means revealing it."],["To start a quarrel",'That idea is closer to "stir up trouble".']],"A",'An idiom is an expression whose meaning is different from its individual words. "Let the cat out of the bag" means to reveal a secret, often by accident.'),G("eng-rep-1","English Language","Reported speech",'Change to reported speech: He said, "I am tired." \u2192 He said that he ___ tired.',[["was"],["is","After a past reporting verb (said), the tense normally moves back one step: am \u2192 was."],["has been","This changes the meaning and does not follow the backshift rule."],["will be","This changes the sentence to the future."]],"A",'In reported speech after a past reporting verb, the present tense moves back to the past tense ("am" becomes "was"), and "I" becomes "he".'),G("sci-acid-1","Integrated Science","Acids, bases and salts","What is the pH of a neutral solution such as pure water (at 25 \xB0C)?",[["0","pH 0 is strongly acidic."],["7"],["14","pH 14 is strongly alkaline (basic)."],["1","pH 1 is strongly acidic, like stomach acid."]],"B","The pH scale runs from 0 to 14. Below 7 is acidic, 7 is neutral and above 7 is alkaline. Pure water at 25 \xB0C has a pH of 7."),G("sci-force-1","Integrated Science","Forces and energy","What is the SI unit of force?",[["Joule","The joule is the unit of energy and work."],["Newton"],["Watt","The watt is the u
