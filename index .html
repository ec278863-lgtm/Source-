",[["13 m\xB2","This adds length and width. Area is length \xD7 width."],["26 m\xB2","26 m is the perimeter (8 + 5 + 8 + 5), not the area."],["40 m\xB2"],["40 m","The number is right but the unit is wrong. Area is measured in square units (m\xB2)."]],"C","Area of a rectangle = length \xD7 width = 8 m \xD7 5 m = 40 m\xB2."),q("eng-agr-1","English Language","Concord (subject\u2013verb agreement)",'Choose the correct word: "Neither the teacher nor the students ___ in the classroom."',[["is",'"Is" is singular, but the subject nearest the verb, "students", is plural.'],["are"],["was",'"Was" is singular, and the sentence is in the present tense.'],["has been",'This does not agree with the plural "students".']],"B",'With "neither \u2026 nor" and "either \u2026 or", the verb agrees with the subject closest to it. "Students" is plural, so we use "are".'),q("eng-agr-2","English Language","Concord (subject\u2013verb agreement)",'Choose the correct word: "Each of the boys ___ a bicycle."',[["have",'The subject is "each", which is singular, even though "boys" is plural.'],["has"],["are having",'This is plural, and "have" (meaning own) is not normally used in the continuous form.'],["were having","This is plural and in the wrong tense."]],"B",'"Each" is the real subject, and it is singular. "Of the boys" just describes it. So the verb is singular: "Each of the boys has a bicycle."'),q("eng-voc-1","English Language","Vocabulary",'Choose the word closest in meaning to the underlined word: "The headmaster commended the pupils."',[["praised"],["punished","This is nearly the opposite of commended."],["warned","To warn is to caution someone, not to approve of them."],["dismissed","To dismiss is to send away."]],"A",'To commend means to praise formally. For example: "The pupils were commended for keeping the compound clean."'),q("eng-voc-2","English Language","Vocabulary",'Choose the word opposite in meaning to "generous".',[["kind","Kind is close in meaning to generous, not opposite."],["mean"],["wealthy","Wealth is about how much you have, not how willing you are to give."],["humble","Humble is about modesty, not about giving."]],"B",'A generous person gives freely. The opposite is "mean" (or stingy), meaning unwilling to give or share.'),q("eng-tense-1","English Language","Tenses",'Choose the correct form: "By the time we arrived, the bus ___."',[["leaves","This is present tense, but the sentence describes the past."],["has left","The present perfect connects to now, but here both actions are in the past."],["had left"],["is leaving","This is present continuous, which does not fit a past event."]],"C",'When one past action happened before another past action, use the past perfect (had + past participle). The bus left first, then we arrived: "the bus had left".'),q("eng-punc-1","English Language","Punctuation","Which sentence is correctly punctuated?",[["Its raining outside.",'"Its" without an apostrophe shows possession (the dog wagged its tail). Here we mean "it is".'],["It's raining outside."],["Its' raining outside.",`"Its'" is never correct in English.`],["It,s raining outside.","A comma cannot replace an apostrophe."]],"B",`"It's" is short for "it is" or "it has". The apostrophe shows where letters have been left out.`),q("sci-cell-1","Integrated Science","Cells and life processes","Which part of a cell controls all its activities?",[["Cell membrane","The membrane controls what enters and leaves the cell, not all its activities."],["Cytoplasm","Cytoplasm is the jelly-like fluid where many reactions happen, but it does not control them."],["Nucleus"],["Cell wall","The cell wall (found in plant cells) gives support and shape."]],"C","The nucleus holds the genetic material (DNA), which directs the cell's activities. It works like the headteacher's office of the cell."),q("sci-photo-1","Integrated Science","Cells and life processes","Which gas do green plants take in for photosynthesis?",[["Oxygen","Oxygen is released during photosynthesis, not taken in."],["Carbon dioxide"],["Nitrogen","Nitrogen is in the air, but plants do not use it in photosynthesis. They take nitrogen in as nitrates through their roots."],["Hydrogen","Plants do not take in hydrogen gas."]],"B","Photosynthesis: carbon dioxide + water \u2192 glucose + oxygen. It needs light energy and chlorophyll. Carbon dioxide enters through the stomata in the leaves."),q("sci-heart-1","Integrated Science","Cells and life processes","Which organ pumps blood around the human body?",[["Lungs","The lungs exchange gases (take in oxygen, remove carbon dioxide). They do not pump blood."],["Kidney","The kidneys filter waste from the blood."],["Heart"],["Liver","The liver processes nutrients and removes toxins."]],"C","The heart is a muscular pump. It sends blood through the arteries to the body and lungs, and the blood returns through the veins."),q("sci-mat-1","Integrated Science","Matter","What is the change of state from solid directly to gas called?",[["Melting","Melting is solid \u2192 liquid."],["Evaporation","Evaporation is liquid \u2192 gas."],["Sublimation"],["Condensation","Condensation is gas \u2192 liquid."]],"C","Sublimation is when a solid turns straight into a gas without becoming a liquid first. Camphor (mothballs) and dry ice are common examples."),q("sci-mat-2","Integrated Science","Matter","Which of these is a chemical change?",[["Melting ice","Melting only changes the state. It is still water, so this is a physical change."],["Dissolving sugar in water","The sugar can be recovered by evaporating the water, so this is a physical change."],["Burning charcoal"],["Boiling water","This is only a change of state (a physical change)."]],"C","Burning charcoal makes new substances (carbon dioxide and ash) and gives off heat. It cannot easily be reversed, so it is a chemical change."),q("sci-elec-1","Integrated Science","Electricity","What is the SI unit of electric current?",[["Volt","The volt is the unit of potential difference (voltage)."],["Ampere"],["Ohm","The ohm is the unit of resistance."],["Watt","The watt is the unit of power."]],"B","Current is measured in amperes (A) with an ammeter, which is connected in series. A useful link: V = I \xD7 R (voltage = current \xD7 resistance)."),q("soc-hist-1","Social Studies","Ghana's history","On which date did Ghana gain independence?",[["6 March 1957"],["1 July 1960","1 July 1960 is when Ghana became a republic."],["6 March 1960","The day is right but the year is wrong."],["24 February 1966","This is the date of the coup that overthrew the First Republic."]],"A","Ghana became independent from British rule on 6 March 1957, the first country in sub-Saharan Africa to do so from colonial rule. 6 March is celebrated as Independence Day."),q("soc-hist-2","Social Studies","Ghana's history","Who was the first President of Ghana?",[["Dr J.B. Danquah","Danquah was a leading figure in the UGCC, but he was never President."],["Dr Kwame Nkrumah"],["J.A. Kufuor","Kufuor was President from 2001 to 2009."],["Dr Hilla Limann","Limann was President of the Third Republic (1979\u20131981)."]],"B","Kwame Nkrumah led Ghana to independence as Prime Minister in 1957. He became the first President when Ghana became a republic in 1960."),q("soc-gov-1","Social Studies","Government","Which arm of government makes laws?",[["The Executive","The Executive (the President and ministers) carries out laws."],["The Judiciary","The Judiciary (the courts) interprets laws."],["The Legislature"],["The Electoral Commission","The Electoral Commission organises elections. It is not an arm of government."]],"C","The Legislature makes laws. In Ghana, the Legislature is Parliament. The three arms are the Legislature (makes laws), the Executive (carries them out) and the Judiciary (interprets them)."),q("soc-gov-2","Social Studies","Government","Which arm of government interprets the law?",[["The Legislature","The Legislature makes laws."],["The Executive","The Executive carries out laws."],["The Judiciary"],["The Police Service","The police enforce the law, but they do not interpret it."]],"C","The Judiciary (the courts, headed by the Chief Justice) interprets laws and settles disputes. Keeping the three arms separate is called separation of powers."),q("soc-env-1","Social Studies","Environment","Which human activity contributes most directly to soil erosion?",[["Planting cover crops","Cover crops protect the soil from rain and wind, so they reduce erosion."],["Deforestation"],["Contour ploughing","Ploughing across a slope slows running water, so it reduces erosion."],["Mulching","Mulch covers and protects the soil, so it reduces erosion."]],"B","Tree roots hold soil together, and the leaves break the force of rain. When forests are cleared, for example for farming, timber or illegal mining (galamsey), rain and wind wash the topsoil away."),q("soc-cit-1","Social Studies","Citizenship","Which of these is a civic responsibility of a Ghanaian citizen?",[["Paying taxes"],["Travelling abroad","Travelling is a personal choice, not a duty to the nation."],["Owning a car","Owning property is a personal choice, not a civic duty."],["Joining a social club","Joining a club is voluntary, not a civic duty."]],"A","Civic responsibilities are duties citizens owe the nation. They include paying taxes, obeying the law, voting and protecting public property. Taxes pay for roads, schools and hospitals."),q("math-ratio-1","Mathematics","Ratio and proportion","Share GH\u20B5 60 between Kofi and Ama in the ratio 2 : 3. How much does Ama get?",[["GH\u20B5 24","GH\u20B5 24 is Kofi's share (2 parts), not Ama's."],["GH\u20B5 36"],["GH\u20B5 30","This splits the money equally. The ratio 2 : 3 gives Ama more."],["GH\u20B5 20","This divides 60 by 3 and ignores the total number of parts (2 + 3 = 5)."]],"B","Total parts = 2 + 3 = 5. One part = 60 \xF7 5 = GH\u20B5 12. Ama gets 3 parts = 3 \xD7 12 = GH\u20B5 36. Check: Kofi 24 + Ama 36 = 60 \u2713."),q("math-ind-1","Mathematics","Indices","Simplify 2\xB3 \xD7 2\u2074.",[["2\u2077"],["2\xB9\xB2","This multiplies the powers. When you multiply numbers with the same base, you add the powers."],["4\u2077","The base stays 2. Only the powers change."],["4\xB9\xB2","This multiplies both the bases and the powers. Neither is correct."]],"A","Law of indices: a\u1D50 \xD7 a\u207F = a\u1D50\u207A\u207F. So 2\xB3 \xD7 2\u2074 = 2\xB3\u207A\u2074 = 2\u2077 = 128."),q("math-stat-1","Mathematics","Statistics","Find the mean of 3, 5, 8, 8 and 11.",[["7"],["8","8 is the median (middle value) and the mode (most frequent), not the mean."],["35","35 is the total. You still need to divide by how many numbers there are."],["5","This divides by 7 instead of by the 5 numbers."]],"A","Mean = sum \xF7 number of values = (3 + 5 + 8 + 8 + 11) \xF7 5 = 35 \xF7 5 = 7."),q("math-num-1","Mathematics","Number and numeration","Express 0.000345 in standard form.",[["3.45 \xD7 10\u207B\u2074"],["3.45 \xD7 10\u2074","A positive power makes a large number. 0.000345 is less than 1, so the power must be negative."],["34.5 \xD7 10\u207B\u2075","The equation is true, but this is not standard form. The first number must be between 1 and 10."],["0.345 \xD7 10\u207B\xB3","This is not standard form either. The first number must be at least 1."]],"A","Standard form is A \xD7 10\u207F, where 1 \u2264 A < 10. Moving the decimal point 4 places right gives 3.45, so 0.000345 = 3.45 \xD7 10\u207B\u2074."),q("eng-prep-1","English Language","Prepositions",'Choose the correct word: "She has been ill ___ Monday."',[["since"],["for",'"For" is used with a length of time (for three days), not a starting point.'],["from",'"From" usually needs an end point (from Monday to Friday).'],["at",`"At" is used for clock times (at 6 o'clock), not days.`]],"A",'Use "since" with a starting point in time (since Monday, since 2020). Use "for" with a length of time (for two weeks).'),q("eng-voc-3","English Language","Vocabulary",'Choose the word closest in meaning to "meticulous": "The new headteacher is very meticulous."',[["careful"],["careless","This is the opposite of meticulous."],["friendly","Friendliness is about how someone treats people, not how carefully they work."],["strict","A strict person enforces rules. Meticulous means paying close attention to detail."]],"A","Meticulous means very careful and precise, paying great attention to every detail."),q("eng-idiom-1","English Language","Idioms",'What does "to let the cat out of the bag" mean?',[["To reveal a secret"],["To free an animal","This is the literal meaning. Idioms have a figurative meaning."],["To make a mistake","Revealing a secret can be a mistake, but the idiom means revealing it."],["To start a quarrel",'That idea is closer to "stir up trouble".']],"A",'An idiom is an expression whose meaning is different from its individual words. "Let the cat out of the bag" means to reveal a secret, often by accident.'),q("eng-rep-1","English Language","Reported speech",'Change to reported speech: He said, "I am tired." \u2192 He said that he ___ tired.',[["was"],["is","After a past reporting verb (said), the tense normally moves back one step: am \u2192 was."],["has been","This changes the meaning and does not follow the backshift rule."],["will be","This changes the sentence to the future."]],"A",'In reported speech after a past reporting verb, the present tense moves back to the past tense ("am" becomes "was"), and "I" becomes "he".'),q("sci-acid-1","Integrated Science","Acids, bases and salts","What is the pH of a neutral solution such as pure water (at 25 \xB0C)?",[["0","pH 0 is strongly acidic."],["7"],["14","pH 14 is strongly alkaline (basic)."],["1","pH 1 is strongly acidic, like stomach acid."]],"B","The pH scale runs from 0 to 14. Below 7 is acidic, 7 is neutral and above 7 is alkaline. Pure water at 25 \xB0C has a pH of 7."),q("sci-force-1","Integrated Science","Forces and energy","What is the SI unit of force?",[["Joule","The joule is the unit of energy and work."],["Newton"],["Watt","The watt is the unit of power."],["Pascal","The pascal is the unit of pressure (force per unit area)."]],"B","Force is measured in newtons (N), named after Isaac Newton. 1 N is the force that gives a 1 kg mass an acceleration of 1 m/s\xB2 (F = ma)."),q("sci-eco-1","Integrated Science","Ecosystems","In the food chain grass \u2192 grasshopper \u2192 lizard \u2192 hawk, what is the grasshopper?",[["Producer","The producer is the grass, which makes its own food by photosynthesis."],["Primary consumer"],["Secondary consumer","The secondary consumer is the lizard, which eats the grasshopper."],["Decomposer","Decomposers (such as fungi and bacteria) break down dead matter. They are not shown in this chain."]],"B","A primary consumer is a herbivore that eats the producer. The grasshopper eats grass, so it is the primary consumer."),q("sci-health-1","Integrated Science","Human health","What causes malaria?",[["A virus","Malaria is not caused by a virus."],["A Plasmodium parasite"],["Bacteria","Malaria is not caused by bacteria, so antibiotics do not treat it."],["The mosquito itself","The female Anopheles mosquito is the vector. It carries the parasite, but it is not the cause."]],"B","Malaria is caused by Plasmodium, a single-celled parasite. It is spread by the bite of an infected female Anopheles mosquito. Treated bed nets and clearing stagnant water help prevent it."),q("soc-geo-1","Social Studies","Ghana's geography","How many administrative regions does Ghana have today?",[["10","Ghana had 10 regions until six new ones were created in 2018\u20132019."],["16"],["12","This is not the current number."],["14","This is not the current number."]],"B","Ghana has 16 regions. Six new regions were created after a 2018 referendum: Ahafo, Bono East, Oti, North East, Savannah and Western North."),q("soc-gov-3","Social Studies","Government","In which year was Ghana's current (Fourth Republic) Constitution approved by referendum?",[["1957","1957 is the year of independence."],["1960","1960 was the First Republic constitution."],["1979","1979 was the Third Republic constitution."],["1992"]],"D","The 1992 Constitution was approved by referendum on 28 April 1992 and came into force on 7 January 1993, starting the Fourth Republic."),q("soc-cit-2","Social Studies","Citizenship","What does the black star in the middle of the Ghana flag represent?",[["African freedom and unity"],["Mineral wealth","Mineral wealth is represented by the gold (yellow) band."],["Forests and farmland","The green band represents forests and natural wealth."],["Those who died for independence","The red band honours those who died in the struggle for independence."]],"A",'The black star is the "lodestar of African freedom". It represents African freedom and unity. Red stands for those who died for independence, gold for mineral wealth and green for forests and farmland.'),q("soc-pop-1","Social Studies","Population","Which is a major effect of rural\u2013urban migration on Ghana's cities?",[["Overcrowding and pressure on housing"],["Fewer people living in cities","Migration into cities increases their population."],["Lower demand for jobs in cities","More people arriving means more people looking for jobs."],["More farm labour in cities","Migrants usually leave farming. Rural areas lose farm labour."]],"A","When many people move from villages to cities such as Accra and Kumasi, it puts pressure on housing, water, transport and jobs. This can lead to slums and congestion."),q("math-frac-2","Mathematics","Fractions","What is 2/5 of GH\u20B5 45?",[["GH\u20B5 18"],["GH\u20B5 9","GH\u20B5 9 is only 1/5 of 45. You need two fifths, so multiply by 2."],["GH\u20B5 22.50","This is half of 45, not two fifths."],["GH\u20B5 112.50",'This multiplies 45 by 5/2. "Of" means multiply by 2/5.']],"A","1/5 of 45 = 45 \xF7 5 = 9, so 2/5 of 45 = 2 \xD7 9 = GH\u20B5 18."),q("math-frac-3","Mathematics","Fractions","Simplify 3/4 \xF7 1/2.",[["3/8","This multiplies the fractions. To divide, multiply by the reciprocal of the second fraction."],["1 1/2"],["2/3","This flips the first fraction instead of the second."],["1/4","This subtracts 1/2 from 3/4 instead of dividing."]],"B","Dividing by 1/2 is the same as multiplying by 2/1: 3/4 \xD7 2/1 = 6/4 = 3/2 = 1 1/2."),q("math-pct-2","Mathematics","Percentages","Kwame scored 36 out of 48 in a test. What is his percentage?",[["75%"],["36%","36 is his raw mark, not a percentage of 48."],["12%","12 is the number of marks he lost (48 \u2212 36), not a percentage."],["133%","This divides 48 by 36. Divide the mark scored by the total: 36 \xF7 48."]],"A","36 \xF7 48 = 0.75, and 0.75 \xD7 100 = 75%."),q("math-pct-3","Mathematics","Percentages","A phone costing GH\u20B5 800 goes up in price by 10%. What is the new price?",[["GH\u20B5 880"],["GH\u20B5 810","This adds GH\u20B5 10, not 10%. 10% of 800 is GH\u20B5 80."],["GH\u20B5 720","This is a 10% decrease. The price went up."],["GH\u20B5 80","GH\u20B5 80 is only the increase. Add it to the old price."]],"A","10% of 800 = 80. New price = 800 + 80 = GH\u20B5 880."),q("math-alg-3","Mathematics","Linear equations","Solve x/3 \u2212 2 = 4.",[["x = 18"],["x = 6","This adds 2 correctly (x/3 = 6) but forgets to multiply by 3."],["x = 2/3","This works out (4 \u2212 2) \xF7 3, which reverses both steps."],["x = 2",'This divides 6 by 3. Undo "\xF7 3" by multiplying by 3.']],"A","Add 2 to both sides: x/3 = 6. Multiply both sides by 3: x = 18. Check: 18/3 \u2212 2 = 4 \u2713."),q("math-geo-3","Mathematics","Angles and shapes","Two angles of a triangle are 65\xB0 and 45\xB0. Find the third angle.",[["70\xB0"],["110\xB0","110\xB0 is the sum of the two given angles. Subtract it from 180\xB0."],["250\xB0","This uses 360\xB0, which is for angles around a point. A triangle's angles add up to 180\xB0."],["20\xB0","This is the difference between the two angles, which has no meaning here."]],"A","Angles in a triangle add up to 180\xB0. 180\xB0 \u2212 (65\xB0 + 45\xB0) = 180\xB0 \u2212 110\xB0 = 70\xB0."),q("math-geo-4","Mathematics","Angles and shapes","Find the area of a circle of radius 7 cm. (Take \u03C0 = 22/7)",[["154 cm\xB2"],["44 cm\xB2","44 cm is the circumference (2\u03C0r), not the area."],["22 cm\xB2","This is \u03C0 \xD7 r. The radius must be squared: \u03C0 \xD7 r \xD7 r."],["308 cm\xB2","This is 2\u03C0r\xB2. The area of a circle is \u03C0r\xB2, without the 2."]],"A","Area = \u03C0r\xB2 = 22/7 \xD7 7 \xD7 7 = 22 \xD7 7 = 154 cm\xB2."),q("math-ratio-2","Mathematics","Ratio and proportion","GH\u20B5 600 is shared between Ama and Esi in the ratio 2 : 3. How much does Esi get?",[["GH\u20B5 360"],["GH\u20B5 240","GH\u20B5 240 is Ama's share (2 parts). Esi gets 3 parts."],["GH\u20B5 200","This divides 600 by 3. First add the parts: 2 + 3 = 5."],["GH\u20B5 300","This shares the money equally. The ratio 2 : 3 is not equal."]],"A","Total parts = 2 + 3 = 5. One part = 600 \xF7 5 = 120. Esi gets 3 \xD7 120 = GH\u20B5 360."),q("math-ind-2","Mathematics","Indices","Simplify 2\xB3 \xD7 2\u2074.",[["2\u2077"],["2\xB9\xB2","This multiplies the indices. When multiplying powers of the same base, add the indices."],["4\u2077","The base stays 2. Only the indices are added."],["2\xB9","This subtracts the indices, which is the rule for division."]],"A","a\u1D50 \xD7 a\u207F = a\u1D50\u207A\u207F, so 2\xB3 \xD7 2\u2074 = 2\xB3\u207A\u2074 = 2\u2077 = 128."),q("math-stat-2","Mathematics","Statistics","Find the median of 7, 3, 9, 4, 6.",[["6"],["9","9 is in the middle of the list as written. Arrange the numbers in order first."],["5.8","5.8 is the mean (29 \xF7 5), not the median."],["29","29 is the total of the numbers, used for the mean."]],"A","In order: 3, 4, 6, 7, 9. The middle (3rd) value is 6."),q("eng-agr-3","English Language","Concord (subject\u2013verb agreement)","Neither the teacher nor the students ___ in the classroom.",[["is",'With "neither \u2026 nor", the verb agrees with the nearer subject, "students", which is plural.'],["are"],["was",'"Was" is singular, but the nearer subject "students" is plural.'],["be",'"Be" is not a finite verb and cannot complete this sentence.']],"B",'With "neither \u2026 nor" and "either \u2026 or", the verb agrees with the subject closest to it. "Students" is plural, so we use "are".'),q("eng-agr-4","English Language","Concord (subject\u2013verb agreement)","Each of the boys ___ a uniform.",[["have",'"Have" agrees with "boys", but the real subject is "each", which is singular.'],["has"],["are having","This is plural and also uses the wrong verb form for possession."],["were having","This is plural and past continuous, which does not fit."]],"B",'"Each" is singular, even when followed by "of the boys". So the verb is singular: "Each of the boys has a uniform."'),q("eng-voc-4","English Language","Vocabulary",'Choose the word nearest in meaning to "diligent".',[["lazy",'"Lazy" is the opposite of diligent.'],["hardworking"],["clever","Being clever is about ability. Diligent is about effort."],["careless",'"Careless" is close to the opposite of diligent.']],"B",'A diligent person works hard and carefully, so the nearest meaning is "hardworking".'),q("eng-voc-5","English Language","Vocabulary",'Choose the word opposite in meaning to "scarce".',[["rare",'"Rare" has a similar meaning to scarce, not the opposite.'],["plentiful"],["expensive",'Scarce things are often expensive, but "expensive" is not the opposite of scarce.'],["small",'"Small" is about size, not amount available.']],"B",'Scarce means there is not enough of something. The opposite is "plentiful" (more than enough).'),q("eng-tense-2","English Language","Tenses","By the time we arrived, the bus ___.",[["leaves","Present simple does not fit a story in the past."],["has left",'Present perfect links to now, but "arrived" puts the whole event in the past.'],["had left"],["is leaving","Present continuous does not fit a completed past event."]],"C",'Use the past perfect ("had left") for an action completed before another past action ("we arrived").'),q("eng-tense-3","English Language","Tenses","She ___ her homework every evening.",[["do",'"Do" is used with I, you, we and they, not with "she".'],["does"],["doing",'"Doing" needs a helping verb, e.g. "is doing".'],["done",'"Done" is a past participle and needs "has" or "had".']],"B",'For habits we use the present simple. With he, she or it, add -s or -es: "She does her homework every evening."'),q("eng-punc-2","English Language","Punctuation","Which sentence is punctuated correctly?",[["Where are you going.","A direct question must end with a question mark."],["Where are you going?"],["where are you going?","A sentence must start with a capital letter."],["Where, are you going?",'There is no reason for a comma after "Where".']],"B","A direct question starts with a capital letter and ends with a question mark."),q("eng-prep-2","English Language","Prepositions","The meeting will start ___ 9 o'clock.",[["in",'"In" is used with months, years and parts of the day (in the morning), not exact clock times.'],["on",'"On" is used with days and dates (on Monday, on 6th March).'],["at"],["by",'"By" means "not later than", so it does not give the exact start time.']],"C",`Use "at" with exact times: at 9 o'clock, at noon, at 6:30.`),q("eng-idiom-2","English Language","Idioms",'"To let the cat out of the bag" means to ___.',[["free an animal","This is the literal meaning. Idioms have a different, non-literal meaning."],["reveal a secret"],["start a quarrel","There is no idea of quarrelling in this idiom."],["waste money","This idiom has nothing to do with money."]],"B",'To "let the cat out of the bag" is to tell a secret, usually by mistake.'),q("eng-rep-2","English Language","Reported speech",'Kofi said, "I am tired." Choose the correct reported speech.',[["Kofi said that he is tired.",'After a past reporting verb ("said"), "am" usually changes to "was".'],["Kofi said that he was tired."],["Kofi said that I was tired.",'"I" must change to "he", because Kof
